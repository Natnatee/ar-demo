<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test 3D Model Render</title>
    <!-- เพิ่ม favicon เพื่อป้องกัน 404 -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #808080; /* พื้นหลังสีเทา */
      }
      canvas {
        width: 100%;
        height: 100vh;
        display: block;
      }
      #error-message {
        position: fixed;
        top: 20px;
        left: 20px;
        background: #ff4d4d;
        color: white;
        padding: 10px;
        border-radius: 5px;
        display: none;
      }
    </style>
    <!-- รวม Three.js และ GLTFLoader จาก CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  </head>
  <body>
    <canvas id="model-canvas"></canvas>
    <div id="error-message"></div>
    <script>
      // ฟังก์ชันแสดงข้อความผิดพลาด
      function showError(message) {
        const errorDiv = document.getElementById("error-message");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
      }

      // เริ่มต้น Three.js
      const canvas = document.getElementById("model-canvas");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x808080); // ตั้งค่าสีพื้นหลัง canvas เป็นสีเทา

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 2, 5); // ปรับตำแหน่งกล้องให้มองเห็น grid และโมเดล

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
      });
      if (canvas.clientWidth === 0 || canvas.clientHeight === 0) {
        canvas.style.width = "100%";
        canvas.style.height = "100vh";
      }
      renderer.setSize(window.innerWidth, window.innerHeight);

      // เพิ่มแสง
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(0, 1, 1);
      scene.add(directionalLight);

      // เพิ่ม GridHelper เพื่อแสดงมิติ
      const gridHelper = new THREE.GridHelper(10, 10, 0x000000, 0x444444); // ขนาด 10x10, สีตาราง
      gridHelper.position.y = -1; // วาง grid ต่ำกว่าโมเดลเล็กน้อย
      scene.add(gridHelper);

      // ตัวแปรสำหรับโมเดล
      let model;

      // ตรวจสอบว่า THREE.GLTFLoader มีอยู่
      if (typeof THREE.GLTFLoader !== "function") {
        showError("GLTFLoader is not available. Check CDN or script loading.");
        throw new Error("GLTFLoader is not available");
      }

      // โหลดโมเดล GLTF
      const loader = new THREE.GLTFLoader();
      loader.load(
        "/public/robot.glb", // เส้นทางไปยังไฟล์ในโฟลเดอร์ public
        (gltf) => {
          model = gltf.scene;
          scene.add(model);

          // ปรับขนาดและตำแหน่งโมเดลให้เหมาะสม
          model.scale.set(1, 1, 1); // ปรับขนาดตามต้องการ
          model.position.set(0, 0, 0); // ตั้งตำแหน่งกึ่งกลาง
          console.log("Model loaded successfully");
        },
        (progress) => {
          console.log(
            `Loading model: ${(
              (progress.loaded / progress.total) *
              100
            ).toFixed(2)}%`
          );
        },
        (error) => {
          console.error("Error loading GLTF model:", error);
          showError("Failed to load model.gltf: " + error.message);
        }
      );

      // จัดการการปรับขนาดหน้าต่าง
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // การเรนเดอร์และหมุนโมเดล
      function animate() {
        requestAnimationFrame(animate);
        if (model) {
          model.rotation.y += 0.01; // หมุนโมเดลรอบแกน Y เพื่อให้เห็นชัด
        }
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
